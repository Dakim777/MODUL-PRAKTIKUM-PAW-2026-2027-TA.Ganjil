<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background rounded square - navy ITERA -->
  <rect width="32" height="32" rx="7" fill="#0d1f3c"/>
  <!-- Subtle inner gradient overlay -->
  <rect width="32" height="32" rx="7" fill="url(#grad)" opacity="0.5"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2451b3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1f3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left bracket < -->
  <polyline points="9,10 4.5,16 9,22" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bracket > -->
  <polyline points="23,10 27.5,16 23,22" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forward slash / -->
  <line x1="19.5" y1="9" x2="12.5" y2="23" stroke="#6b9ae8" stroke-width="2.4" stroke-linecap="round"/>
</svg>
